<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="6.5in" height="5.296in" viewBox="0 0 702 572" role="img" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>HVSR methodology workflow</title>
<desc>Workflow from ambient noise recording, windowing, screening, per-window H/V ratios and mean HVSR, to peak selection with SESAME checks; then fill thickness, Vs profile and H/V peak amplitude; finally the reconstructed natural surface with fill volume and the dynamic response per terrace, with a validation note.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4A5560" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{fill:#2B3440}
.th{font-size:12.5px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.ts{font-size:10.5px;text-anchor:middle;dominant-baseline:central}
.lg{font-size:11px;dominant-baseline:central}
.it{font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.w text,text.w{fill:#FFFFFF}
.arr{stroke:#4A5560;stroke-width:1.5;fill:none}
.c1{fill:#E4E8EC;stroke:#8793A0;stroke-width:1}
.c2{fill:#DCE9F6;stroke:#6C9BCB;stroke-width:1}
.c3{fill:#A9C8E8;stroke:#3F7CB5;stroke-width:1}
.c4{fill:#1F4E79;stroke:#163A5C;stroke-width:1}
.ic{fill:none;stroke:#2B3440;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic text{stroke:none}
.ic.inv{stroke:#FFFFFF}
.ic.inv text{fill:#FFFFFF}
.dash{stroke-dasharray:3 2.5}
.soft{fill:#2B3440;fill-opacity:.3}
.note{fill:#FFFFFF;stroke:#8793A0;stroke-width:1;stroke-dasharray:4 3}
</style>
</defs>
<rect width="702" height="572" fill="#FFFFFF"/>
<rect class="c1" x="16" y="16" width="122" height="100" rx="8"/>
<g class="ic" transform="translate(77.0 40)"><polyline points="-13,0 -9,0 -6,-9 -2,9 2,-6 5,4 8,0 13,0"/></g>
<text class="th" x="77.0" y="74">Recording</text>
<text class="ts" x="77.0" y="91">3-component sensor</text>
<text class="ts" x="77.0" y="105">15 stations</text>
<line class="arr" x1="139" y1="66.0" x2="152" y2="66.0" marker-end="url(#ar)"/>
<rect class="c2" x="153" y="16" width="122" height="100" rx="8"/>
<g class="ic" transform="translate(214.0 40)"><line x1="-14" y1="9" x2="14" y2="9"/><rect x="-13" y="-9" width="7" height="14"/><rect x="-3.5" y="-9" width="7" height="14"/><rect x="6" y="-9" width="7" height="14"/></g>
<text class="th" x="214.0" y="74">Windowing</text>
<text class="ts" x="214.0" y="91">Baseline correction</text>
<text class="ts" x="214.0" y="105">~200 s windows</text>
<line class="arr" x1="276" y1="66.0" x2="289" y2="66.0" marker-end="url(#ar)"/>
<rect class="c2" x="290" y="16" width="122" height="100" rx="8"/>
<g class="ic" transform="translate(351.0 40)"><path d="M-12 -10 L12 -10 L3 0 L3 10 L-3 7 L-3 0 Z"/></g>
<text class="th" x="351.0" y="74">Screening</text>
<text class="ts" x="351.0" y="91">STA/LTA + crest</text>
<text class="ts" x="351.0" y="105">factor rejection</text>
<line class="arr" x1="413" y1="66.0" x2="426" y2="66.0" marker-end="url(#ar)"/>
<rect class="c2" x="427" y="16" width="122" height="100" rx="8"/>
<g class="ic" transform="translate(488.0 40)"><text class="it" x="0" y="-7">H</text><line x1="-8" y1="0" x2="8" y2="0"/><text class="it" x="0" y="9">V</text></g>
<text class="th" x="488.0" y="74">H/V ratio</text>
<text class="ts" x="488.0" y="91">FFT, taper, smooth</text>
<text class="ts" x="488.0" y="105">H ÷ V per window</text>
<line class="arr" x1="550" y1="66.0" x2="563" y2="66.0" marker-end="url(#ar)"/>
<rect class="c2" x="564" y="16" width="122" height="100" rx="8"/>
<g class="ic" transform="translate(625.0 40)"><line x1="-13" y1="10" x2="13" y2="10"/><path d="M-13 8 C-6 8 -5 -10 0 -10 C5 -10 6 8 13 8"/></g>
<text class="th" x="625.0" y="74">Mean HVSR</text>
<text class="ts" x="625.0" y="91">Lognormal mean</text>
<text class="ts" x="625.0" y="105">± std. deviation</text>
<line class="arr" x1="625.0" y1="116" x2="625.0" y2="139" marker-end="url(#ar)"/>
<rect class="c2" x="16" y="140" width="670" height="70" rx="8"/>
<g class="ic" transform="translate(62 175)"><line x1="-14" y1="12" x2="14" y2="12"/><path d="M-14 10 C-7 10 -6 -10 0 -10 C6 -10 7 10 14 10"/><circle cx="0" cy="-10" r="2.4" fill="#2B3440"/><path class="dash" d="M-14 -14 V-18 H14 V-14"/></g>
<text class="th" x="360" y="156">Peak selection and quality control</text>
<text class="ts" x="360" y="175">f₀ and A₀ read on the mean curve within a constrained band (4.7–50 Hz)</text>
<text class="ts" x="360" y="191">Peak reliability and clarity checked with the SESAME criteria</text>
<rect class="c3" x="16" y="236" width="206" height="110" rx="8"/>
<g class="ic" transform="translate(119.0 260)"><rect x="-13" y="-11" width="20" height="10"/><rect x="-13" y="-1" width="20" height="10"/><line x1="11" y1="-11" x2="11" y2="9"/><path d="M8 -11 H14 M8 9 H14 M9 -7 L11 -11 L13 -7 M9 5 L11 9 L13 5"/></g>
<text class="th" x="119.0" y="290">Fill thickness</text>
<text class="ts" x="119.0" y="307.0">h = Vs / (4 f₀)</text>
<text class="ts" x="119.0" y="320.5">Assumed Vs = 150–350 m/s</text>
<text class="ts" x="119.0" y="334.0">First-order, model-dependent</text>
<rect class="c3" x="248" y="236" width="206" height="110" rx="8"/>
<g class="ic" transform="translate(351.0 260)"><line x1="-12" y1="-11" x2="-12" y2="11"/><path d="M-12 -10 H-4 V-2 H3 V6 H12"/></g>
<text class="th" x="351.0" y="290">Vs profile</text>
<text class="ts" x="351.0" y="307.0">Inversion of the HVSR curve</text>
<text class="ts" x="351.0" y="320.5">Where the data allow</text>
<text class="ts" x="351.0" y="334.0">Can constrain Vs for h</text>
<rect class="c3" x="480" y="236" width="206" height="110" rx="8"/>
<g class="ic" transform="translate(583.0 260)"><rect x="-13" y="-11" width="26" height="9"/><rect class="soft" x="-13" y="-2" width="26" height="12"/></g>
<text class="th" x="583.0" y="290">H/V peak amplitude</text>
<text class="ts" x="583.0" y="307.0">A₀ indicates the strength of</text>
<text class="ts" x="583.0" y="320.5">the H/V spectral contrast</text>
<text class="ts" x="583.0" y="334.0">Not absolute amplification</text>
<line class="arr" x1="119.0" y1="210" x2="119.0" y2="235" marker-end="url(#ar)"/>
<line class="arr" x1="351.0" y1="210" x2="351.0" y2="235" marker-end="url(#ar)"/>
<line class="arr" x1="583.0" y1="210" x2="583.0" y2="235" marker-end="url(#ar)"/>
<line class="arr dash" x1="247" y1="286" x2="223" y2="286" marker-end="url(#ar)"/>
<rect class="c4" x="16" y="372" width="322" height="96" rx="8"/>
<rect class="c4" x="364" y="372" width="322" height="96" rx="8"/>
<g class="ic inv" transform="translate(177 396)"><path d="M-13 11 C-6 11 -4 3 0 1 C4 -1 8 -5 13 -5" stroke-width="2.4"/><path class="dash" d="M-13 0 H-6 V-5 H2 V-10 H13"/></g>
<text class="th w" x="177" y="426">Natural surface and fill volume</text>
<text class="ts w" x="177" y="443">Interpolated thickness + mapped terrace geometry</text>
<text class="ts w" x="177" y="457">Inferred pre-construction ground</text>
<g class="ic inv" transform="translate(525 396)"><rect x="-7" y="-2" width="14" height="11"/><line x1="-15" y1="9" x2="15" y2="9"/><path d="M-12 -5 Q-16 1 -12 7 M-17 -7 Q-22 1 -17 9 M12 -5 Q16 1 12 7 M17 -7 Q22 1 17 9"/></g>
<text class="th w" x="525" y="426">Dynamic response per terrace</text>
<text class="ts w" x="525" y="443">Compare f₀, A₀ and Vs among terraces</text>
<text class="ts w" x="525" y="457">Evidence of variability, not a stability measure</text>
<line class="arr" x1="119.0" y1="346" x2="119.0" y2="371" marker-end="url(#ar)"/>
<line class="arr" x1="583.0" y1="346" x2="583.0" y2="371" marker-end="url(#ar)"/>
<path class="arr" d="M351.0 346 V359 H440"/>
<line class="arr" x1="440" y1="359" x2="440" y2="371" marker-end="url(#ar)"/>
<rect class="note" x="16" y="488" width="670" height="44" rx="8"/>
<text class="th" x="351" y="503">Validation required</text>
<text class="ts" x="351" y="519">Independent Vs measurements and ground truth for fill thickness (wall heights, excavation records)</text>
<rect class="c1" x="30" y="547" width="14" height="14" rx="3"/>
<text class="lg" x="52" y="554">Field work</text>
<rect class="c2" x="140" y="547" width="14" height="14" rx="3"/>
<text class="lg" x="162" y="554">Processing</text>
<rect class="c3" x="255" y="547" width="14" height="14" rx="3"/>
<text class="lg" x="277" y="554">Derived parameters</text>
<rect class="c4" x="410" y="547" width="14" height="14" rx="3"/>
<text class="lg" x="432" y="554">Final products</text>
<line class="arr dash" x1="540" y1="554" x2="568" y2="554"/>
<text class="lg" x="574" y="554">Vs constraint</text>
</svg>